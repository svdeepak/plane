# Task 18 — Invoke a coding agent (Claude Code) against a fixed prompt on CI.
#
# This workflow demonstrates the "coding agent in the build pipeline" pattern.
# It runs the official Claude Code GitHub Action in "agent mode" (a `prompt:`
# input is supplied, so it runs non-interactively without needing an @claude
# mention) against a FIXED prompt of our choosing.
#
# Auth: uses a Claude subscription OAuth token (no metered API key).
#   Generate locally with:  claude setup-token
#   Then store it in the fork:  Settings > Secrets and variables > Actions
#     Secret name:  CLAUDE_CODE_OAUTH_TOKEN
#
# Trigger: manual only (workflow_dispatch) — safest for a demo; no cost on push.

name: Coding Agent — Fixed Prompt Demo

on:
    workflow_dispatch:
        inputs:
            prompt:
                description: "Prompt to send the agent (defaults to the fixed prompt below)"
                required: false
                default: ""

# The agent may open a PR / push a branch, so grant the minimum needed.
# id-token: write is required by claude-code-action to fetch an OIDC token.
permissions:
    contents: write
    pull-requests: write
    issues: read
    id-token: write

jobs:
    run-agent:
        name: Run Claude Code against a fixed prompt
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
              with:
                  fetch-depth: 1

            # The fixed "prompt of choice" for this task. Low-risk and
            # produces a visible, reviewable artifact (a docs addition).
            # An input override is allowed for experimentation, but the
            # default below is the fixed prompt the task calls for.
            - name: Resolve prompt
              id: prompt
              env:
                  # Pass the user input via env so the shell never parses its
                  # quotes/backticks — prevents injection and word-splitting bugs.
                  INPUT_PROMPT: ${{ github.event.inputs.prompt }}
              run: |
                  DEFAULT_PROMPT="Add a short 'Running the coding agent in CI' section near the top of CONTRIBUTING.md (create the file if it does not exist) that explains, in 4-6 bullet points readable by a non-engineer, how this repository invokes an AI coding agent from GitHub Actions. Do not modify any source code. Keep the change to documentation only."
                  CHOSEN="$INPUT_PROMPT"
                  if [ -z "$CHOSEN" ]; then CHOSEN="$DEFAULT_PROMPT"; fi
                  # Multi-line-safe output
                  {
                    echo "value<<PROMPT_EOF"
                    echo "$CHOSEN"
                    echo "PROMPT_EOF"
                  } >> "$GITHUB_OUTPUT"

            - name: Install Claude Code CLI
              run: npm install -g @anthropic-ai/claude-code

            - name: Run Claude Code headless against the fixed prompt
              env:
                  CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
                  PROMPT: ${{ steps.prompt.outputs.value }}
              run: |
                  set -o pipefail
                  # Headless, non-interactive. The CLI always executes the agent
                  # (unlike the PR/issue-oriented marketplace action), so a
                  # workflow_dispatch file-generation task runs reliably.
                  claude -p "$PROMPT" \
                      --output-format json \
                      --max-turns 15 \
                      --allowedTools "Read,Edit,Write,Glob,Grep" \
                      --permission-mode acceptEdits \
                      > /tmp/agent-out.json
                  echo "=== agent result summary ==="
                  jq -r '.subtype // "n/a", "turns=\(.num_turns // "?")", "cost_usd=\(.total_cost_usd // "?")"' /tmp/agent-out.json 2>/dev/null || cat /tmp/agent-out.json
                  echo "=== agent narrative ==="
                  jq -r '.result // .text // empty' /tmp/agent-out.json 2>/dev/null | head -40

            - name: Show what changed (full diff) and open a PR
              if: always()
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  echo "=== git status ==="
                  git status --porcelain
                  echo ""
                  echo "=== FULL diff (this is exactly what the agent wrote) ==="
                  git --no-pager diff
                  echo ""
                  # Also write the full diff into the run summary so it's viewable in the UI.
                  {
                      echo "## What the agent changed"
                      echo '```diff'
                      git --no-pager diff
                      echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"

                  # Persist the change as a reviewable PR (only if the agent actually changed something).
                  if [ -n "$(git status --porcelain)" ]; then
                      BRANCH="agent/demo-$(date +%s)"
                      git config user.name "coding-agent-ci"
                      git config user.email "coding-agent-ci@users.noreply.github.com"
                      git checkout -b "$BRANCH"
                      git add -A
                      git commit -m "docs: agent-generated change from fixed-prompt CI demo"
                      git push origin "$BRANCH"
                      gh pr create \
                          --base "${{ github.ref_name }}" \
                          --head "$BRANCH" \
                          --title "Agent demo: fixed-prompt change" \
                          --body "Automated change produced by the Coding Agent — Fixed Prompt Demo workflow (task 18). Review the diff; close without merging if this is just a demo run."
                      echo "Opened a PR from $BRANCH — the agent's change is now persisted and reviewable."
                  else
                      echo "Agent made no changes; nothing to open a PR for."
                  fi
